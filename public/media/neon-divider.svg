<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="32" viewBox="0 0 1200 32" role="img" aria-labelledby="title">
  <title id="title">Neon glow divider</title>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#00d9ff"/>
      <stop offset="0.52" stop-color="#7867ff"/>
      <stop offset="0.82" stop-color="#ec54da"/>
      <stop offset="1" stop-color="#ec54da" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M18 16H1182" stroke="url(#beam)" stroke-width="7" stroke-linecap="round" opacity="0.72" filter="url(#glow)"/>
  <path d="M18 16H1182" stroke="url(#beam)" stroke-width="2" stroke-linecap="round"/>
</svg>
